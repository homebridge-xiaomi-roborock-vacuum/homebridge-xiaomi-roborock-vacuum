name: "CI"

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, next]

jobs:
  lint:
    name: "Check lint rules"
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Same major as the publish workflow
        node-version: [26.x]

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  build:
    name: "Typescript build"
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Same major as the publish workflow
        node-version: [26.x]

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm ci
      - run: npm run build

  tests:
    name: "Run tests"
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Keep in sync with package.json "engines.node"
        node-version: [22.x, 24.x, 26.x]

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm ci
      - run: npm test -- --coverage
        env:
          CI: true
      - run: npx codecov@3.7.0
        env:
          CI: true
          CODECOV_TOKEN: eb2ac9d8-8f8f-4901-aaa9-73670a149904
