name: "CI"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: "Check lint rules"
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Same major as the publish workflow
        node-version: [26.x]

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  build:
    name: "Typescript build"
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Same major as the publish workflow
        node-version: [26.x]

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm ci
      - run: npm run build

  load:
    name: "Load the built plugin"
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # The oldest Node in "engines.node": the built plugin (not only the sources) loads on it
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - name: Load dist/index.js and register with a stub API
        run: |
          # Homebridge loads plugins with import(), like this ESM script
          node --input-type=module -e '
            import assert from "node:assert";
            const { default: plugin } = await import("./dist/index.js");
            const registered = [];
            plugin({
              registerAccessory: (_plugin, name) => registered.push(`accessory:${name}`),
              registerPlatform: (_plugin, name) => registered.push(`platform:${name}`),
            });
            assert.deepStrictEqual(registered, [
              "accessory:XiaomiRoborockVacuum",
              "platform:XiaomiRoborockVacuum",
            ]);
            console.log(`Loaded on Node ${process.version}:`, registered);
          '

  tests:
    name: "Run tests"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with package.json "engines.node"
        node-version: [22.x, 24.x, 26.x]

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm ci
      - run: npm test -- --coverage
        env:
          CI: true
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          # Pull requests from forks get no secrets: the action uploads them tokenless (public repo)
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          disable_search: true
          flags: node-${{ matrix.node-version }}
